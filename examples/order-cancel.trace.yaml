# Example trace stances for UC-ORDER-CANCEL-001 (docs/trace.md)
# Trace all layers:
#   npm run check -- examples/order-cancel.usecase.yaml --trace examples/order-cancel.trace.yaml \
#     --results unit=examples/order-cancel.unit-results.xml \
#     --results integration=examples/order-cancel.integration-results.xml \
#     --results e2e=examples/order-cancel.e2e-results.xml
trace: UC-ORDER-CANCEL-001

untested: # the reasons come from the question list and the layer routing, not from convenience
  T-PLACED-cancel-o2: "question list: the IR and the bindings name nothing that shows the fee charged"
  RACE-PACKED-hand_over-cancel-outcome: "question list: the IR names no returns-flow control"
  RACE-PLACED-pack-cancel: "the winner is decided by the backend; this example has no backend to test"
  RACE-PACKED-hand_over-cancel: "the winner is decided by the backend; this example has no backend to test"

negative_controls:
  RULE-001:
    status: verified
    controls:
      - layer: unit
        oracle: "cancellation before packing is free"
        breakage: "expect feeCents 100 instead of 0 in the step definitions, regenerate"
        observed_failure: "RULE-001-c1: expected { kind: 'free', feeCents: +0 } to deeply equal { kind: 'free', feeCents: 100 }"
        verified: "2026-10-28 local"
      - layer: unit
        oracle: "cancellation after packing shows the fee notice"
        breakage: "expect the canceled_notice literal key instead, regenerate"
        observed_failure: "RULE-001-c2: expected { kind: 'fee_notice', …(1) } to deeply equal { kind: 'fee_notice', …(1) }"
        verified: "2026-10-28 local"
  SC-001:
    status: verified
    controls:
      - layer: integration
        oracle: 'the order status shows "Delivered" after complete'
        breakage: "expect status_canceled instead in the step definitions, regenerate"
        observed_failure: "order-status: Expected \"Canceled\", Received \"Delivered\""
        verified: "2026-10-28 local, generated product code in Chromium"
  SC-002:
    status: verified
    controls:
      - layer: integration
        oracle: 'the order status shows "Canceled" after cancel'
        breakage: "expect status_packed instead in the step definitions, regenerate"
        observed_failure: "order-status: Expected \"Packed\", Received \"Canceled\""
        verified: "2026-10-28 local, generated product code in Chromium"
  SC-003:
    status: verified
    controls:
      - layer: integration
        oracle: "the cancellation fee notice is shown after cancel from PACKED"
        breakage: "assert the notice is hidden instead in the step definitions, regenerate"
        observed_failure: "cancellation-fee-notice: Expected hidden (the notice was shown)"
        verified: "2026-10-28 local, generated product code in Chromium"
  RACE-PLACED-pack-cancel-outcome:
    status: verified
    controls:
      # Inverting the assertion was not a control: an absence check passes before the click's
      # response renders. Withholding the race's fixture is
      - layer: integration
        oracle: 'the packing screen shows the "Canceled" notice when pack is rejected'
        breakage: "remove the fake's conflict rejection of pack from the test"
        observed_failure: "canceled-notice: Expected \"Canceled\", element(s) not found"
        verified: "2026-10-28 local, generated product code in Chromium"
