# Example ESDD bindings: the locator / literal contract of UC-PROFILE-EMAIL-001
# Both the generated component and the generated tests take their vocabulary from this file alone.
# Check it: pnpm check examples/contact-email.usecase.yaml --bindings examples/contact-email.bindings.yaml
bindings: UC-PROFILE-EMAIL-001
platform: web
graph: account

events: # IR event vocabulary → GraphQL operations (called_api is mechanically derived from operation/kind)
  save: { operation: UpdateContactEmail, kind: mutation, called_api: calledUpdateContactEmailMutation }

elements: # spec-vocabulary id → locator. Exactly one addressing form (role+name / label / testid / text)
  settings_heading: { role: heading, name: "Contact settings" }
  email_input: { label: "Email address" }
  newsletter_toggle: { role: checkbox, name: "Receive the newsletter" }
  save_button: { role: button, name: "Save" }

literals:
  required_error: "Please enter your email address"
  max_length_error: "Email address must be 255 characters or fewer"
  save_success_toast: "Your email address has been updated"
  save_failure_message: "Failed to save your changes. Please try again later"

literal_coverage: # a stance for every rule in the IR (the checker cross-checks the full population)
  RULE-001: { literal: required_error } # the max-length error is the same rule's second case (also listed in literals)
  RULE-002: { literal: save_success_toast }
