# Example ESDD UseCase IR (no states = form mode): changing the contact email address
# The checker enforces coverage of the inputs axis matrix (field/option × condition).
# Check it: pnpm check examples/contact-email.usecase.yaml --bindings examples/contact-email.bindings.yaml
usecase: UC-PROFILE-EMAIL-001
name: Changing the contact email address
source:
  spec: "https://example.com/specs/contact-email"
  version: "v1"

inputs:
  - id: email
    kind: field
    required: true
  - id: newsletter_opt_in
    kind: option

scenarios:
  - id: SC-001
    name: the email address can be changed
    critical: true
    covers: ["newsletter_opt_in×default"]
    given: ["a signed-in user has the settings screen open"]
    when: ["they enter a new email address and save"]
    then:
      - '"Your email address has been updated" is shown'
      - "UpdateContactEmail is called with the entered value"
  - id: SC-002
    name: the newsletter setting can be toggled and saved
    covers: ["newsletter_opt_in×set"]
    given: ["a signed-in user has the settings screen open"]
    when: ["they toggle the newsletter opt-in and save"]
    then: ["UpdateContactEmail is called with the toggled value"]

rules:
  - id: RULE-001
    name: input validation
    cases:
      - input: "the email address is empty"
        expected: 'show "Please enter your email address" and do not save'
        covers: "email×empty"
      - input: "the email address is 255 characters (exactly at the limit)"
        expected: "saves successfully"
        covers: "email×boundary"
      - input: "the email address is 256 characters (over the limit)"
        expected: 'show "Email address must be 255 characters or fewer" and do not save'
        covers: "email×boundary"
  - id: RULE-002
    name: save result notification
    cases:
      - { input: "save succeeded", expected: 'show "Your email address has been updated" as a toast' }
      - { input: "save failed (server error)", expected: 'show "Failed to save your changes. Please try again later"' }
